# SpecAssay Check config -- HomesFlow
# Migrated 2026-08-18 from .specify/extensions/clewseau-gate/clewseau-gate-config.yml
# (v0.2.0, clew.json) to real specassay v0.4.11 (trace-manifest.json).
# Same registry, same globs, same ID grammar -- only the emitter and
# its own new capabilities (uncovered-proof, execution-verified proven,
# the block_uncovered_proof/test_results opt-ins) are new.

registry: "HomesFlow.prd.md"
target_name: "HomesFlow"
manifest_path: "trace-manifest.json"

specs: "specs/**/spec.md"
tasks: "specs/**/tasks.md"

src_globs:
  - "ios/**/*.swift"
test_globs:
  - "ios/**/*Tests*/**/*.swift"

id_regex: "(FR|NFR|AC|US)-[A-Z][A-Z0-9]{1,5}-[0-9]{2,}[a-z]?"
covers_regex: "@covers[[:space:]]+.*"
carries_regex: "\*\*(Carries|Traces)\*\*:"
test_ac_regex: "AC_[A-Z][A-Z0-9]{1,5}_[0-9]{2,}[a-z]?"

# Rule 6a: proven derives from a passing XCTest run, not a matching
# name. xcodebuild has no native JUnit exporter; scripts/xcresult-to-
# junit.py converts the .xcresult bundle CI already produces. Wired
# 2026-08-18 (speccost-honesty-economics-2026-08-17_1.md's own
# derivation, migrated here from SpecCost per the same design).
test_results: "test-results.xml"
