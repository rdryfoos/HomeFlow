installed:
- clewseau-gate
settings:
  auto_execute_hooks: true
hooks:
  after_implement:
  - extension: clewseau-gate
    command: speckit.clewseau-gate.check
    enabled: true
    optional: true
    priority: 10
    prompt: Run Clewseau Gate 2 traceability check?
    description: Refuse silent gaps after implementation; refresh clew.json
    condition: null
