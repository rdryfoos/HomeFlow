installed:
- agent-context
- specassay-check
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  after_implement:
  - extension: specassay-check
    command: speckit.specassay.check
    enabled: true
    optional: true
    priority: 10
    prompt: Run SpecAssay Check (Gate 2 traceability)?
    description: Refuse silent gaps after implementation; refresh trace-manifest.json
    condition: null
